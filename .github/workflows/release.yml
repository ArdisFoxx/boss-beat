name: Create Module Files For GitHub Release
#
# Same pattern as Ardis's other modules (ardisfoxxs-lewd-rpg, ardisfoxxs-lewd-pf2e,
# ardisfoxxs-drakkenheim) - version and download URL are derived from the release tag at
# build time via token substitution, so there's nothing in the committed module.json that
# has to be kept in sync with the tag by hand. The previous version of this workflow instead
# hard-failed the whole build if the committed module.json version didn't exactly match the
# tag - which is exactly what happened the first time this ran (module.json said 1.6.6, the
# tags created were 1.6.4 and 1.6.5), so no assets ever got attached and Foundry's install
# had nothing to download. This version can't hit that failure mode: the tag IS the version.

env:
  # Doesn't change per release - Foundry's "check for updates" always re-fetches this same
  # URL, which resolves to whichever published (non-prerelease) release most recently
  # uploaded a module.json here.
  latest_manifest_url: "https://github.com/${{ github.repository }}/releases/latest/download/module.json"

  # This release's own archive - keyed to the exact tag being published right now.
  release_module_url: "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.zip"

on:
  # Only real published releases - not draft saves, not plain tag pushes (tagging alone
  # doesn't create or publish a release, and this workflow won't fire for it).
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Accepts either "1.2.3" or "v1.2.3" as the tag - Ardis's tags on this repo so far
      # have been the bare form ("1.6.4", "1.6.5"), matching his other modules.
      - name: Extract Version From Tag
        id: get_version
        uses: battila7/get-version-action@v2

      # Rewrites the #{VERSION}# and #{DOWNLOAD}# placeholders in module.json with this
      # release's real values. Only touches the action's checked-out copy of the file, not
      # anything committed to the repo.
      - name: Modify Module Manifest With Release-Specific Values
        uses: cschleiden/replace-tokens@v1
        with:
          files: "module.json"
        env:
          VERSION: ${{ steps.get_version.outputs.version-without-v }}
          DOWNLOAD: ${{ env.release_module_url }}

      # Everything Foundry actually needs to load and run the module. Excludes .git/.github
      # and any pipeline-only tooling that never belongs in a player's install.
      - name: Create Module Archive
        run: |
          zip \
            --recurse-paths \
            ./module.zip \
            module.json \
            README.md \
            LICENSE \
            scripts \
            styles \
            templates \
            lang \
            assets

      - name: Update Release With Files
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.event.release.name }}
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "./module.json, ./module.zip"
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}
